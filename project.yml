# XcodeGen project for TrailApp.
#
# SETUP (on your Mac):
#   1. brew install xcodegen
#   2. Your Apple Developer Team ID is filled in below (M6ZPV2R8F8).
#   3. xcodegen generate   (or: make generate)
#   4. Open TrailApp.xcodeproj in Xcode 16 and build.
#
# The iOS app embeds the watchOS app (application.watchapp2). Shared/ is
# compiled into both targets — it is intentionally limited to Foundation +
# CoreLocation so it builds on both platforms.

name: TrailApp

options:
  bundleIdPrefix: com.example.trailapp
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

settings:
  CODE_SIGN_STYLE: Automatic
  # Apple Developer Team ID (Kei Hon Lam, membership via 2027-09-04).
  DEVELOPMENT_TEAM: M6ZPV2R8F8

targets:
  TrailApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TrailApp
      - path: Shared
    # Bundled sample GPX routes (imported into the library on first launch).
    resources:
      - path: SampleRoutes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.trailapp
    info:
      # XcodeGen requires `path` here; it generates this Info.plist from
      # `properties` below when the file doesn't exist yet.
      path: TrailApp/Info.plist
      properties:
        CFBundleDisplayName: TrailApp
        NSLocationWhenInUseUsageDescription: TrailApp shows your location on the route map while you browse imported routes.
        # "Open in TrailApp" support for .gpx files (Files, Safari, AirDrop).
        CFBundleDocumentTypes:
          - CFBundleTypeName: GPX route file
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.example.trailapp.gpx
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.example.trailapp.gpx
            UTTypeDescription: GPX route file
            UTTypeConformsTo:
              - public.xml
            UTTypeTagSpecification:
              public.filename-extension:
                - gpx
              public.mime-type:
                - application/gpx+xml
    entitlements:
      path: TrailApp/TrailApp.entitlements
    dependencies:
      # XcodeGen embeds the watch app into the iOS app from this dependency.
      - target: TrailAppWatch

  TrailAppWatch:
    type: application.watchapp2
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: TrailAppWatch
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.trailapp.watchkitapp
    info:
      # XcodeGen requires `path` here; it generates this Info.plist from
      # `properties` below when the file doesn't exist yet.
      path: TrailAppWatch/Info.plist
      properties:
        CFBundleDisplayName: TrailApp
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.example.trailapp
        NSLocationWhenInUseUsageDescription: TrailApp tracks your position along the route during hikes, including in the background while a workout is active.
        NSHealthShareUsageDescription: TrailApp reads your heart rate during hikes to display it on the navigation screen.
        NSHealthUpdateUsageDescription: TrailApp saves your hikes as workouts.
        # Keeps GPS delivery alive with the wrist down during a hike.
        UIBackgroundModes:
          - workout-processing
    entitlements:
      path: TrailAppWatch/TrailAppWatch.entitlements
      properties:
        # Required for HKWorkoutSession + heart-rate streaming on watchOS.
        com.apple.developer.healthkit: true
